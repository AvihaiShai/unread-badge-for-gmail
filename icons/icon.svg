<?xml version="1.0" encoding="UTF-8"?>
<!--
  Design source for the toolbar icon. The shipped PNGs are not rendered from
  this file: icons/make-icons.py draws each size independently so that strokes
  and gaps land on whole pixels at 16px. This SVG is the 128px reference, with
  the same numbers the script computes for size 128.

  Deliberately not an envelope, and deliberately not Google red: the mark is a
  stack of list rows with an unread dot, in violet and white.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Unread Badge for Gmail</title>

  <rect x="0" y="0" width="128" height="128" rx="28" ry="28" fill="#3D2A7A"/>

  <g fill="#FFFFFF">
    <!-- row 0: short, to clear the dot -->
    <rect x="24" y="34" width="48" height="13" rx="6.5"/>
    <!-- row 1: full width -->
    <rect x="24" y="57" width="80" height="13" rx="6.5"/>
    <!-- row 2: medium -->
    <rect x="24" y="80" width="58" height="13" rx="6.5"/>
  </g>

  <!-- unread dot with a tile-coloured ring so it stays separated from row 0 -->
  <circle cx="94" cy="34" r="21" fill="#3D2A7A"/>
  <circle cx="94" cy="34" r="15" fill="#FFFFFF"/>
</svg>
